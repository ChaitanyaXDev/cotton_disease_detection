<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice | PlantPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='custom_ui.css') }}">
    <style>
        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .error-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 24px;
            box-shadow: var(--card-shadow-hover);
            padding: 40px 32px;
            max-width: 540px;
            width: 100%;
            margin: auto;
            text-align: center;
        }

        .error-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.12);
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 24px;
        }

        .btn-return-home {
            background: linear-gradient(135deg, var(--color-primary) 0%, #16a34a 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px var(--color-primary-glow);
        }

        .btn-return-home:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--color-primary-glow);
        }
    </style>
</head>
<body>
    <!-- Sticky Glass Navbar -->
    <header class="main-navbar-wrapper">
        <div class="container">
            <nav class="navbar navbar-expand-lg">
                <a class="navbar-brand d-flex align-items-center gap-2 text-white text-decoration-none" href="/">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="PlantPulse Logo"
                         style="height: 38px; width: 38px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
                    <span class="fw-bold fs-4 tracking-wide">PlantPulse</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container py-5 my-auto">
        <div class="error-card">
            <div class="error-icon-wrap">
                <i class="fas fa-circle-exclamation"></i>
            </div>
            <h3 class="fw-bold mb-2">Attention Needed</h3>
            <p class="text-muted mb-4" style="font-size: 1.05rem; line-height: 1.6;">
                {{ message if message else 'An unexpected condition was encountered during processing.' }}
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn-return-home">
                    <i class="fas fa-arrow-left"></i> Return to Disease Detection
                </a>
            </div>
        </div>
    </main>

    <footer class="py-3 border-top mt-auto text-center text-muted" style="background: var(--color-surface); font-size: 0.9rem;">
        <div class="container">
            <strong class="text-success">PlantPulse</strong> &bull; Cotton Crop Health & Disease Detection
        </div>
    </footer>
</body>
</html>
