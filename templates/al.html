<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPulse - Agronomy Virtual Assistant</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='custom_ui.css') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0d321d 0%, #124024 50%, #082012 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        .assistant-hero-wrap {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .assistant-glass-card {
            max-width: 720px;
            width: 100%;
            padding: 44px 32px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        .assistant-icon-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(16, 185, 129, 0.15));
            border: 2px solid rgba(74, 222, 128, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #4ade80;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.3);
        }

        #welcome-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #welcome-btn:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 10px 28px rgba(34, 197, 94, 0.6);
            transform: translateY(-2px);
        }

        .chat-box {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 380px;
            height: 520px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            border-radius: 20px;
            background: #ffffff;
            overflow: hidden;
            display: none;
            z-index: 1050;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-box.large {
            width: 85%;
            height: 82%;
            bottom: 9%;
            right: 7.5%;
            border-radius: 24px;
        }

        .chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.45);
            transition: all 0.3s ease;
            z-index: 1040;
            color: #ffffff;
            font-size: 1.5rem;
        }

        .chat-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <!-- Top Glass Navigation Bar -->
    <header class="main-navbar-wrapper">
        <div class="container">
            <nav class="navbar navbar-expand-lg">
                <a class="navbar-brand d-flex align-items-center gap-2 text-white text-decoration-none" href="/">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="PlantPulse Logo"
                         style="height: 38px; width: 38px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
                    <span class="fw-bold fs-4 tracking-wide">PlantPulse</span>
                </a>

                <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fas fa-bars fs-4 text-white"></i>
                </button>

                <div class="collapse navbar-collapse" id="navContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                        <li class="nav-item">
                            <a class="nav-link-item" href="/"><i class="fas fa-search"></i> Disease Detection</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-item active" href="/al"><i class="fas fa-robot"></i> Virtual Assistant</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-item" href="/weather"><i class="fas fa-cloud-sun"></i> Weather Forecast</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link-item" href="/comparison"><i class="fas fa-chart-line"></i> Model Comparison</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <div class="assistant-hero-wrap">
        <div class="assistant-glass-card">
            <div class="assistant-icon-badge">
                <i class="fas fa-robot"></i>
            </div>
            <h1 class="display-6 fw-bold mb-3">Agronomy AI Assistant</h1>
            <p class="text-white-50 fs-5 mb-4" style="max-width: 580px; margin: 0 auto;">
                Ask agronomy questions, inquire about dosage guidelines, disease prevention tactics, and treatment schedules.
            </p>
            <button id="welcome-btn">
                <i class="fas fa-comments"></i> Start Consultation
            </button>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">
        <iframe src="https://dante-ai.com/embed/?kb_id=ddd0859c-819e-4eb5-90ce-9066fca39f8e&token=44799c79-5f25-4cb6-987c-f137a384a9ff&modeltype=gpt-4-omnimodel-mini&mode=false&logo=ZmFsc2U%3D&bubble=true&bubbleopen=false"></iframe>
    </div>

    <!-- Chat Toggle Button -->
    <div class="chat-toggle" id="chat-toggle" title="Toggle Assistant Chat">
        <i class="fas fa-comment-dots"></i>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://dante-ai.com/bubble-embed.js"></script>
    <script>
        const welcomeBtn = document.getElementById('welcome-btn');
        const chatBox = document.getElementById('chat-box');
        const chatToggle = document.getElementById('chat-toggle');

        // Toggle chat box visibility
        chatToggle.addEventListener('click', () => {
            chatBox.style.display = chatBox.style.display === 'block' ? 'none' : 'block';
        });

        // Show large chat box on button click
        welcomeBtn.addEventListener('click', () => {
            chatBox.style.display = 'block';
            chatBox.classList.add('large');
        });
    </script>
</body>
</html>
